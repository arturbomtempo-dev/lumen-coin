name: Keep Render Alive

on:
  schedule:
    # A cada 14 minutos (Render dorme após 15 min de inatividade)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_API_URL }}/institutions")
          echo "Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Backend está acordado."
          else
            echo "Ping retornou $STATUS — backend pode estar inicializando."
          fi
