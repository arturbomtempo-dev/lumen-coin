spring.application.name=lumen-coin-api
spring.config.import=optional:dotenv:.env
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lumen-coin-db}
spring.datasource.username=${DB_USER:lumen}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.security.jwt.secret=${JWT_SECRET:replace-this-with-a-very-long-secret-key-at-least-256-bits}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.jwt.cookie-name=${JWT_COOKIE_NAME:lumen_auth}
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.url=${APP_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${APP_MAIL_FROM:noreply@lumencoin.com}
app.mail.enabled=${APP_MAIL_ENABLED:false}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

waha.base-url=${WAHA_BASE_URL:http://localhost:3000}
waha.api-key=${WAHA_API_KEY:}
waha.session=${WAHA_SESSION:default}
waha.enabled=${WAHA_ENABLED:false}
